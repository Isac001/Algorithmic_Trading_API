
# Service definitions for Docker Compose
services:

  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: database
    ports:
      - "5432:5432"

    # Database Configuration (Credentials match SQLAlchemy setup)
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=database

    # Persist database data using a named volume.
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      
    # Healthcheck to prevent race conditions (app/worker starts only when DB is ready).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Application Service (API Front-end)
  app:

    # Builds the image from the Dockerfile in the current directory.
    build: .
    container_name: trading_api

    # Defines the image name for the build result.
    image: ${COMPOSE_PROJECT_NAME:-trading_api}_app
    ports:
      - "8000:8000"

    # Loads environment variables (e.g., database credentials for Alembic/FastAPI).
    env_file:
      - .env
      
    # CRITICAL: Sets Python path for internal package imports (e.g., trading_api.*).
    environment:
      - PYTHONPATH=/app

    # Waits until 'db' is healthy before starting.
    depends_on:
      db:
        condition: service_healthy
        
    # Command: Runs Alembic migrations first, then starts Uvicorn.
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn trading_api.main:app --host 0.0.0.0 --port 8000 --reload"
      
    # Mounts only necessary directories for development
    volumes:
      - ./trading_api:/app/trading_api
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini
      - ./requirements.txt:/app/requirements.txt
     

  # 3. Daily Worker Service (Cron Job Simulation - Requirement 59)
  daily_worker:

    # Uses the same image built by the 'app' service for consistency.
    image: ${COMPOSE_PROJECT_NAME:-trading_api}_app
    container_name: daily_indicator_worker
    
    # CRITICAL: Must wait for the DB to be ready.
    depends_on:
      db:
        condition: service_healthy
        
    # CRITICAL: Sets Python path for internal imports (e.g., trading_api.modules).
    environment:
      - PYTHONPATH=/app
      
    # Loads environment variables.
    env_file:
      - .env

    # Command: Runs the worker script in a perpetual loop (simulating a cron job).
    # The 'sleep 86400' simulates a 24-hour interval.
    command: >
      /bin/sh -c "while true; do 
        echo '--- Running Daily Ingestion Job ---';
        python /app/trading_api/modules/data_sourcing/worker.py; 
        echo '--- Daily Ingestion Job Finished ---';
        sleep 86400; 
      done"
      
    # Mounts only necessary directories
    volumes:
      - ./trading_api:/app/trading_api
      - ./tests:/app/tests

  # 4. Test Service (Optional - for running tests inside container)
  tests:
    image: ${COMPOSE_PROJECT_NAME:-trading_api}_app
    container_name: trading_api_tests
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ./trading_api:/app/trading_api
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./requirements.txt:/app/requirements.txt

    # Run tests (comment out for interactive shell)
    command: >
      /bin/sh -c "pytest tests/ -v"

# Declare the named volume for persistent database storage.
volumes:
  postgres_data: