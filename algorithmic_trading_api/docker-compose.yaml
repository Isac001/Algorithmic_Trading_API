services:
  # O PostgreSQL database service.
  db:
    # Use the official PostgreSQL image.
    image: postgres:15-alpine

    # Database a name.
    container_name: database

    # Map port 5432 on the host to port 5432 in the container.
    ports:
      - "5432:5432"

    # Set environment variables for the database configuration.
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=database

    # Persist database data on the host machine using a named volume.
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      
    # CORREÇÃO CRÍTICA: Adiciona o healthcheck para saber quando o DB está pronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The FastAPI application service.
  app:
    # Build the Docker image from the Dockerfile in the current directory.
    build: .

    # Container Name.
    container_name: trading_api

    # Map port 8000 on the host to port 8000 in the container.
    ports:
      - "8000:8000"

    # Load environment variables from a .env file.
    env_file:
      - .env

    # CORREÇÃO CRÍTICA: Espera até que o 'db' esteja saudável antes de iniciar
    depends_on:
      db:
        condition: service_healthy
        
    # Comando (Mantido: Alembic upgrade head é executado no início)
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn trading_api.main:app --host 0.0.0.0 --port 8000"
      
    # Mount the local source code directory into the container for live-reloading during development.
    volumes:
      - ./trading_api:/app/trading_api

# Declare the named volume for persistent database storage.
volumes:
  postgres_data: